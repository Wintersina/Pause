name: Unity tests

# Runs the project's custom editor test runner (AllTests) headless in the GameCI Unity
# container, split into duration-balanced shards that run in parallel. PRs run only the
# suites their diff can affect (plus a smoke set); master pushes and manual runs run
# everything. See docs/ci-unity-tests.md (secrets UNITY_EMAIL, UNITY_PASSWORD).

on:
  pull_request:
    branches: [master]
    # Draft PRs are not tested: agents push to drafts often. Marking a PR ready runs the tests.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  # Nightly full-lane run (PAUSE_TEST_FULL=1: every variant, device and seed) on master.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Full lane: set PAUSE_TEST_FULL=1 (every variant / device / seed; slower). Default is the gate lane."
        required: false
        default: false
        type: boolean
      suites:
        description: "Comma-separated suites to run (empty = all). Example: ShopTest,CodexTest"
        required: false
        default: ""
      graphics:
        description: "Graphics suites: xvfb (software GL, default) or skip (exclude suites that read pixels back)"
        required: false
        default: xvfb
        type: choice
        options: [xvfb, skip]
      shards:
        description: "Max parallel shards (empty = repo variable UNITY_CI_SHARDS, else 4). 1 = serial through the global seat queue"
        required: false
        default: ""

permissions:
  contents: read

# Scheduled runs and manual runs get a per-run group (unity-schedule-<run id>), so a nightly can
# neither cancel nor queue behind a PR run.
# PRs: a newer push cancels the older run of the same PR only. master / manual runs are never
# cancelled. Draft runs (all jobs skipped) get their own group so they cannot cancel a real run.
# Serial fallback (shards = 1) queues every run on one global group, like the single-seat days.
concurrency:
  group: >-
    ${{ (inputs.shards || vars.UNITY_CI_SHARDS) == '1' && 'unity-personal-seat' ||
    github.event_name == 'pull_request' && format('unity-pr-{0}{1}', github.event.pull_request.number, github.event.pull_request.draft && '-draft' || '') ||
    format('unity-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && (inputs.shards || vars.UNITY_CI_SHARDS) != '1' }}

env:
  UNITY_IMAGE_TAG: ubuntu-6000.3.23f1-android-3.2.2
  MAX_SHARDS: ${{ inputs.shards || vars.UNITY_CI_SHARDS || '4' }}

jobs:
  plan:
    name: Plan tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # Only the C# sources are needed to read the suite list and map files to suites.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            scripts
            Pause/Assets/**/*.cs
          sparse-checkout-cone-mode: false

      - name: Choose suites and shards
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          INPUT_SUITES: ${{ inputs.suites }}
          INPUT_GRAPHICS: ${{ inputs.graphics }}
        run: |
          set -euo pipefail
          if [ "$FORK" = "true" ]; then
            echo "::notice::Fork PR: repository secrets are not available, skipping Unity tests."
            echo "run=false" >> "$GITHUB_OUTPUT"; echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"; exit 0
          fi
          : > changed.txt
          if [ "$EVENT" = "pull_request" ]; then
            # Paginated PR file list (renames contribute both names). On any failure the planner runs everything.
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > changed.txt \
              || { echo "::warning::Could not list PR files; running the full suite"; : > changed.txt; }
          fi
          ROOT="$PWD" python3 -I scripts/tools/ci_plan.py --event "$EVENT" --files changed.txt \
            --suites "$INPUT_SUITES" --graphics "${INPUT_GRAPHICS:-xvfb}" --max-shards "$MAX_SHARDS" --out plan.json > plan.md
          cat plan.md >> "$GITHUB_STEP_SUMMARY"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 -c 'import json;print(json.dumps(json.load(open("plan.json"))["matrix"]))')" >> "$GITHUB_OUTPUT"

  test:
    name: Tests (shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check for secrets
        id: gate
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          for v in UNITY_EMAIL UNITY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Unity secrets missing::Add these repository secrets:$missing (see docs/ci-unity-tests.md)"
            echo "### Unity tests cannot run" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing secrets:$missing. See docs/ci-unity-tests.md." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/lib/node_modules
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - uses: actions/checkout@v4

      # Restore only; shard 0 saves (below, even when tests fail) so shards never race on one key.
      - name: Restore Library cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: Pause/Library
          key: Library-${{ hashFiles('Pause/ProjectSettings/ProjectVersion.txt', 'Pause/Packages/manifest.json') }}-${{ hashFiles('Pause/Assets/**/*.meta') }}
          restore-keys: |
            Library-${{ hashFiles('Pause/ProjectSettings/ProjectVersion.txt', 'Pause/Packages/manifest.json') }}-
            Library-

      - name: Run suites
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          SHARD: ${{ matrix.shard }}
          SUITES: ${{ matrix.suites }}
          # Full lane for the nightly and for a manual run with `full`; empty (gate lane) for every other event,
          # PRs and master pushes included, so their behaviour is unchanged.
          PAUSE_TEST_FULL: ${{ (github.event_name == 'schedule' || inputs.full) && '1' || '' }}
        run: |
          set -uo pipefail
          mkdir -p ci-out
          echo "$SUITES" | tr ',' '\n' > ci-out/suites.txt
          echo "Shard $SHARD: $(wc -l < ci-out/suites.txt) suites"
          method=AllTests.RunSuites
          extra=(-suites "$SUITES")

          echo "::add-mask::$UNITY_EMAIL"
          echo "::add-mask::$UNITY_PASSWORD"
          # HOME for the container (its own runner VM per shard, so licensing state is never
          # shared); holds the client's state so the always() return step can hand the seat back.
          mkdir -p ci-out/home

          cat > ci-out/run.sh <<'INNER'
          set -u
          export HOME=/ci-home
          LIC=/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client
          # EXACTLY ONE login attempt, no retries: repeated failures get the
          # Unity account blocked. Any failure ends the job.
          # (The password is only ever read from the environment, never interpolated.)
          if ! "$LIC" --activate-all --include-personal --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" > /tmp/act.log 2>&1; then
            cat /tmp/act.log
            echo "Personal activation failed; not retrying." 
            rm -f /workspace/ci-out/activated
            exit 3
          fi
          touch /workspace/ci-out/activated
          # Deactivate (return the entitlement-based Personal seat) once, on any exit from here on.
          # Non-fatal; credentials come from the environment only; output is the client's own log.
          release() {
            if "$LIC" --deactivate-all --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" > /tmp/deact.log 2>&1; then
              touch /workspace/ci-out/deactivated; echo "Unity seat deactivated"
            else
              echo "WARNING: Unity deactivation failed:"; cat /tmp/deact.log
            fi
          }
          trap release EXIT
          echo "Personal license activated"
          apt-get update -qq >/dev/null 2>&1
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 >/dev/null 2>&1 || true
          xvfb-run -a -s "-screen 0 1280x720x24" \
            /opt/unity/Editor/Unity -batchmode -quit -force-glcore \
            -projectPath /workspace/Pause \
            -executeMethod "$1" "${@:2}" \
            -logFile /workspace/ci-out/unity.log
          code=$?
          chown -R "$HOST_UID:$HOST_GID" /workspace/Pause/Library /workspace/ci-out 2>/dev/null || true
          exit $code
          INNER
          sed -i 's/^          //' ci-out/run.sh

          # Stagger logins so the shards do not hit the licensing service in the same second.
          sleep $((SHARD * 20))
          # Tail the log so progress is visible in the Actions UI.
          touch ci-out/unity.log
          ( tail -n +1 -F ci-out/unity.log 2>/dev/null & echo $! > ci-out/tail.pid )
          docker run --rm \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -e UNITY_EMAIL -e UNITY_PASSWORD -e GITHUB_ACTIONS -e PAUSE_TEST_FULL \
            -v "$PWD:/workspace" -v "$PWD/ci-out/home:/ci-home" \
            "unityci/editor:${UNITY_IMAGE_TAG}" \
            bash /workspace/ci-out/run.sh "$method" "${extra[@]}"
          code=$?
          kill "$(cat ci-out/tail.pid)" 2>/dev/null || true
          echo "$code" > ci-out/exit-code.txt
          exit $code

      - name: Return Unity Personal seat (backstop)
        if: always()
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          # The container deactivates on exit. This only acts if activation succeeded but
          # deactivation did not complete (e.g. the container was killed). One attempt, non-fatal.
          if [ ! -f ci-out/activated ]; then echo "Activation did not succeed; nothing to return."; exit 0; fi
          if [ -f ci-out/deactivated ]; then echo "Seat already deactivated."; exit 0; fi
          mkdir -p ci-out/home
          docker run --rm -e UNITY_EMAIL -e UNITY_PASSWORD -v "$PWD/ci-out/home:/ci-home" "unityci/editor:${UNITY_IMAGE_TAG}" \
            bash -c 'HOME=/ci-home /opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client --deactivate-all --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"' \
            || echo "::warning::Seat deactivation failed; check https://id.unity.com"
          sudo rm -rf ci-out/home || true

      - name: Summary
        if: always()
        run: |
          log=ci-out/unity.log
          {
            echo "### Unity tests, shard ${{ matrix.shard }}"
            if [ ! -s "$log" ]; then echo "No Unity log was produced (license or container failure)."; exit 0; fi
            echo '```'
            grep -E '^\[ALL\] (RunAll|RunSuites|[0-9]+ suites|RESULT)' "$log" | tail -5
            echo '```'
            fails=$(grep -E '^\[ALL\] [A-Za-z0-9_]+: FAIL' "$log" || true)
            if [ -n "$fails" ]; then echo "**Failed suites**"; echo '```'; echo "$fails"; echo '```'; fi
            echo "Passed suites: $(grep -cE '^\[ALL\] [A-Za-z0-9_]+: PASS' "$log")"
          } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q '^\[ALL\] RESULT: PASS' "$log"; then
            echo "::error::No '[ALL] RESULT: PASS' line in the Unity log"
            exit 1
          fi

      - name: Upload Unity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-log-shard-${{ matrix.shard }}
          path: |
            ci-out/unity.log
            ci-out/suites.txt
            ci-out/exit-code.txt
          if-no-files-found: ignore

      # Saved even when tests failed, by shard 0 only, and only when the exact key was not restored.
      - name: Save Library cache
        if: always() && matrix.shard == 0 && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Pause/Library
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Stable required-check name. Fails if the plan failed or any shard did not succeed.
  aggregate:
    name: AllTests
    needs: [plan, test]
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard
        env:
          PLAN: ${{ needs.plan.result }}
          RUN: ${{ needs.plan.outputs.run }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "plan=$PLAN run=$RUN tests=$TEST"
          [ "$PLAN" = "success" ] || { echo "::error::Test planning failed"; exit 1; }
          [ "$RUN" = "true" ] || { echo "::notice::Unity tests skipped (fork PR)"; exit 0; }
          [ "$TEST" = "success" ] || { echo "::error::Shards did not all pass (result: $TEST)"; exit 1; }
