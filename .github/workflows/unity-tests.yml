name: Unity tests

# Runs AllTests (the project's custom editor test runner) headless in the
# GameCI Unity container. See docs/ci-unity-tests.md for one-time setup
# (secrets UNITY_EMAIL, UNITY_PASSWORD: Personal activation through the Unity Licensing Client).

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      suites:
        description: "Comma-separated suites to run (empty = all). Example: ShopTest,CodexTest"
        required: false
        default: ""
      graphics:
        description: "Graphics suites: xvfb (software GL, default) or skip (exclude suites that read pixels back)"
        required: false
        default: xvfb
        type: choice
        options: [xvfb, skip]

# One Unity Personal seat for the whole repo: every run (any branch or PR)
# queues for it instead of racing. GitHub keeps at most one pending run per
# group, so a newer queued run replaces an older queued one.
concurrency:
  group: unity-personal-seat
  cancel-in-progress: false

permissions:
  contents: read

env:
  UNITY_IMAGE_TAG: ubuntu-6000.3.23f1-android-3.2.2

jobs:
  test:
    name: AllTests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check for secrets
        id: gate
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FORK" = "true" ]; then
            echo "::notice::Fork PR: repository secrets are not available, skipping Unity tests."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          missing=""
          for v in UNITY_EMAIL UNITY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Unity secrets missing::Add these repository secrets:$missing (see docs/ci-unity-tests.md)"
            echo "### Unity tests cannot run" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing secrets:$missing. See docs/ci-unity-tests.md." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/lib/node_modules
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Cache Library
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: Pause/Library
          key: Library-${{ hashFiles('Pause/ProjectSettings/ProjectVersion.txt', 'Pause/Packages/manifest.json') }}-${{ hashFiles('Pause/Assets/**/*.meta') }}
          restore-keys: |
            Library-${{ hashFiles('Pause/ProjectSettings/ProjectVersion.txt', 'Pause/Packages/manifest.json') }}-
            Library-

      - name: Run AllTests
        if: steps.gate.outputs.run == 'true'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          INPUT_SUITES: ${{ inputs.suites }}
          INPUT_GRAPHICS: ${{ inputs.graphics }}
        run: |
          set -uo pipefail
          mkdir -p ci-out
          ALLTESTS=Pause/Assets/Editor/Tests/AllTests.cs
          TESTS_DIR=Pause/Assets/Editor/Tests

          # All registered suites, in file order.
          grep -oE '^\s*\("[A-Za-z0-9_]+", [A-Za-z0-9_]+\.Execute\)' "$ALLTESTS" | grep -oE '"[A-Za-z0-9_]+"' | tr -d '"' > ci-out/all-suites.txt
          # Suites whose source reads rendered pixels back (need a GPU/GL context).
          : > ci-out/graphics-suites.txt
          while read -r s; do
            f="$TESTS_DIR/$s.cs"
            if [ -f "$f" ] && grep -qE 'Camera\.Render|Graphics\.Blit|ReadPixels|RenderTexture' "$f"; then echo "$s" >> ci-out/graphics-suites.txt; fi
          done < ci-out/all-suites.txt
          echo "Suites: $(wc -l < ci-out/all-suites.txt), graphics-dependent: $(wc -l < ci-out/graphics-suites.txt)"

          method=AllTests.RunAll
          extra=()
          if [ -n "$INPUT_SUITES" ]; then
            method=AllTests.RunSuites; extra=(-suites "$INPUT_SUITES")
          elif [ "${INPUT_GRAPHICS:-xvfb}" = "skip" ]; then
            list=$(grep -vxFf ci-out/graphics-suites.txt ci-out/all-suites.txt | paste -sd, -)
            echo "::notice::Graphics suites excluded (graphics=skip): $(paste -sd, ci-out/graphics-suites.txt)"
            method=AllTests.RunSuites; extra=(-suites "$list")
          fi

          echo "::add-mask::$UNITY_EMAIL"
          echo "::add-mask::$UNITY_PASSWORD"
          # HOME for the container; holds the licensing client's state so the
          # separate always() return step can hand the seat back.
          mkdir -p ci-out/home

          cat > ci-out/run.sh <<'INNER'
          set -u
          export HOME=/ci-home
          LIC=/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client
          # EXACTLY ONE login attempt, no retries: repeated failures get the
          # Unity account blocked. Any failure ends the job.
          # (The password is only ever read from the environment, never interpolated.)
          if ! "$LIC" --activate-all --include-personal --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" > /tmp/act.log 2>&1; then
            cat /tmp/act.log
            echo "Personal activation failed; not retrying." 
            rm -f /workspace/ci-out/activated
            exit 3
          fi
          touch /workspace/ci-out/activated
          # Deactivate (return the entitlement-based Personal seat) once, on any exit from here on.
          # Non-fatal; credentials come from the environment only; output is the client's own log.
          release() {
            if "$LIC" --deactivate-all --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" > /tmp/deact.log 2>&1; then
              touch /workspace/ci-out/deactivated; echo "Unity seat deactivated"
            else
              echo "WARNING: Unity deactivation failed:"; cat /tmp/deact.log
            fi
          }
          trap release EXIT
          echo "Personal license activated"
          apt-get update -qq >/dev/null 2>&1
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 >/dev/null 2>&1 || true
          xvfb-run -a -s "-screen 0 1280x720x24" \
            /opt/unity/Editor/Unity -batchmode -quit -force-glcore \
            -projectPath /workspace/Pause \
            -executeMethod "$1" "${@:2}" \
            -logFile /workspace/ci-out/unity.log
          code=$?
          chown -R "$HOST_UID:$HOST_GID" /workspace/Pause/Library /workspace/ci-out 2>/dev/null || true
          exit $code
          INNER
          sed -i 's/^          //' ci-out/run.sh

          # Tail the log so progress is visible in the Actions UI.
          touch ci-out/unity.log
          ( tail -n +1 -F ci-out/unity.log 2>/dev/null & echo $! > ci-out/tail.pid )
          docker run --rm \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -e UNITY_EMAIL -e UNITY_PASSWORD \
            -v "$PWD:/workspace" -v "$PWD/ci-out/home:/ci-home" \
            "unityci/editor:${UNITY_IMAGE_TAG}" \
            bash /workspace/ci-out/run.sh "$method" "${extra[@]}"
          code=$?
          kill "$(cat ci-out/tail.pid)" 2>/dev/null || true
          echo "$code" > ci-out/exit-code.txt
          exit $code

      - name: Return Unity Personal seat (backstop)
        if: always() && steps.gate.outputs.run == 'true'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          # The container deactivates on exit. This only acts if activation succeeded but
          # deactivation did not complete (e.g. the container was killed). One attempt, non-fatal.
          if [ ! -f ci-out/activated ]; then echo "Activation did not succeed; nothing to return."; exit 0; fi
          if [ -f ci-out/deactivated ]; then echo "Seat already deactivated."; exit 0; fi
          mkdir -p ci-out/home
          docker run --rm -e UNITY_EMAIL -e UNITY_PASSWORD -v "$PWD/ci-out/home:/ci-home" "unityci/editor:${UNITY_IMAGE_TAG}" \
            bash -c 'HOME=/ci-home /opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client --deactivate-all --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"' \
            || echo "::warning::Seat deactivation failed; check https://id.unity.com"
          sudo rm -rf ci-out/home || true

      - name: Summary
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          log=ci-out/unity.log
          {
            echo "### Unity tests"
            if [ ! -s "$log" ]; then echo "No Unity log was produced (license or container failure)."; exit 0; fi
            echo '```'
            grep -E '^\[ALL\] (RunAll|RunSuites|[0-9]+ suites|RESULT)' "$log" | tail -5
            echo '```'
            fails=$(grep -E '^\[ALL\] [A-Za-z0-9_]+: FAIL' "$log" || true)
            if [ -n "$fails" ]; then echo "**Failed suites**"; echo '```'; echo "$fails"; echo '```'; fi
            echo "Passed suites: $(grep -cE '^\[ALL\] [A-Za-z0-9_]+: PASS' "$log")"
            if [ "${{ inputs.graphics }}" = "skip" ]; then echo "Graphics suites excluded: $(paste -sd, ci-out/graphics-suites.txt)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q '^\[ALL\] RESULT: PASS' "$log"; then
            echo "::error::No '[ALL] RESULT: PASS' line in the Unity log"
            exit 1
          fi

      - name: Upload Unity log
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unity-log
          path: |
            ci-out/unity.log
            ci-out/graphics-suites.txt
            ci-out/exit-code.txt
          if-no-files-found: ignore
