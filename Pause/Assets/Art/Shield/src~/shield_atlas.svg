<?xml version="1.0" encoding="UTF-8"?>
<!-- Contour shield plate atlas (ShipShield / ShieldContour).
     Akira-palette flat cel art: one base tone, one hard shadow tone, one
     hard highlight sliver, thick ink outline. No gradients, no blur.
     Four 64x64 cells, mapped onto the hex plates that ring each hull:
       0 plate      - idle energy plate
       1 cracked    - plate after absorbing a hit (ink fracture, magenta edge)
       2 white      - solid cell; the mesh tints it per vertex (ink, line, fill)
       3 hot        - flash pose: white-hot plate used for zip / impact frames
     In each cell the TOP edge is the plate's outer side (away from the hull),
     the BOTTOM edge sits toward the hull, so the shadow tone is at the bottom.
     Rasterize with ./render.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64">
  <!-- 0: plate -->
  <g>
    <polygon points="10,8 54,8 60,32 54,56 10,56 4,32" fill="#2BD9E8"/>
    <polygon points="7,44 57,44 54,56 10,56" fill="#1A86A6"/>
    <polygon points="14,14 42,14 38,21 12,21" fill="#D6FFFF"/>
    <polygon points="10,8 54,8 60,32 54,56 10,56 4,32" fill="none" stroke="#0E0A24" stroke-width="8" stroke-linejoin="miter"/>
  </g>
  <!-- 1: cracked plate -->
  <g transform="translate(64,0)">
    <polygon points="10,8 54,8 60,32 54,56 10,56 4,32" fill="#22B5CC"/>
    <polygon points="7,40 57,40 54,56 10,56" fill="#156E8C"/>
    <polyline points="22,8 30,22 24,31 36,42 30,56" fill="none" stroke="#FF2E9A" stroke-width="9" stroke-linejoin="miter"/>
    <polyline points="22,8 30,22 24,31 36,42 30,56" fill="none" stroke="#0E0A24" stroke-width="5" stroke-linejoin="miter"/>
    <polygon points="38,13 50,13 47,19 36,19" fill="#D6FFFF"/>
    <polygon points="10,8 54,8 60,32 54,56 10,56 4,32" fill="none" stroke="#0E0A24" stroke-width="8" stroke-linejoin="miter"/>
  </g>
  <!-- 2: solid white (vertex-tinted) -->
  <rect x="128" y="0" width="64" height="64" fill="#FFFFFF"/>
  <!-- 3: hot plate -->
  <g transform="translate(192,0)">
    <polygon points="10,8 54,8 60,32 54,56 10,56 4,32" fill="#FFFFFF"/>
    <polygon points="7,46 57,46 54,56 10,56" fill="#9FF8FF"/>
    <polygon points="10,8 54,8 60,32 54,56 10,56 4,32" fill="none" stroke="#0E0A24" stroke-width="8" stroke-linejoin="miter"/>
  </g>
</svg>
