<?xml version="1.0" encoding="UTF-8"?>
<!-- Shatter shards: the contour shield's plates breaking off when it ends.
     Four 64x64 shard shapes (picked per plate), each a flat teal base, one
     hard shadow tone, one highlight sliver and a thick ink outline. Shard 3
     is the bone-hot one that reads as the breaking edge. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64">
  <g stroke-linejoin="round">
    <polygon points="8,52 30,8 56,40" fill="#1FB5B9"/>
    <polygon points="8,52 56,40 36,34" fill="#0F5E6A"/>
    <polygon points="26,18 30,10 36,22" fill="#6EF2EE"/>
    <polygon points="8,52 30,8 56,40" fill="none" stroke="#140C14" stroke-width="6"/>
  </g>
  <g transform="translate(64,0)" stroke-linejoin="round">
    <polygon points="6,30 40,8 58,20 22,56" fill="#1FB5B9"/>
    <polygon points="22,56 58,20 50,16 18,46" fill="#0F5E6A"/>
    <polygon points="14,28 38,13 42,17 18,31" fill="#6EF2EE"/>
    <polygon points="6,30 40,8 58,20 22,56" fill="none" stroke="#140C14" stroke-width="6"/>
  </g>
  <g transform="translate(128,0)" stroke-linejoin="round">
    <polygon points="12,48 48,12 52,52" fill="#1FB5B9"/>
    <polygon points="12,48 52,52 40,40" fill="#0F5E6A"/>
    <polygon points="12,48 48,12 52,52" fill="none" stroke="#140C14" stroke-width="6"/>
  </g>
  <g transform="translate(192,0)" stroke-linejoin="round">
    <polygon points="10,38 30,8 54,26 34,56" fill="#F4EAD4"/>
    <polygon points="34,56 54,26 46,24 30,46" fill="#6EF2EE"/>
    <polygon points="10,38 30,8 54,26 34,56" fill="none" stroke="#140C14" stroke-width="6"/>
  </g>
</svg>
