<?xml version="1.0" encoding="UTF-8"?>
<!-- Pause HUD quick-action icon: Replay (restart run).
     80s neon-sign style, shared with the other quick-action icon: a
     deep synthwave plate with scanlines and a horizon grid, a magenta
     neon-tube rim, and the glyph as a cyan neon tube (wide bloom, saturated
     tube, white-hot core). Elements marked class="plate" are stripped
     for the glyph-only variant.
     Rasterize with ./render.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A0B3D"/>
      <stop offset="0.62" stop-color="#2B0E4F"/>
      <stop offset="0.63" stop-color="#120626"/>
      <stop offset="1" stop-color="#07030F"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.3" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="plateClip"><rect x="9" y="9" width="110" height="110" rx="22"/></clipPath>
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4.5"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>
  <rect class="plate" x="9" y="9" width="110" height="110" rx="22" fill="url(#sky)" fill-opacity="0.9"/>
  <path class="plate" clip-path="url(#plateClip)" d="M43.0 81 L-32.0 125 M53.5 81 L16.0 125 M64.0 81 L64.0 125 M74.5 81 L112.0 125 M85.0 81 L160.0 125 M0 86 H128 M0 93 H128 M0 103 H128 M0 117 H128" fill="none" stroke="#FF3EA5" stroke-width="1.4" stroke-opacity="0.35"/>
  <rect class="plate" clip-path="url(#plateClip)" x="9" y="9" width="110" height="110" fill="url(#scan)"/>
  <rect class="plate" x="9" y="9" width="110" height="110" rx="22" fill="none" stroke="#FF2E97" stroke-width="7" stroke-opacity="0.75" filter="url(#bloom)"/>
  <rect class="plate" x="9" y="9" width="110" height="110" rx="22" fill="none" stroke="#FF4FB0" stroke-width="4"/>
  <rect class="plate" x="9" y="9" width="110" height="110" rx="22" fill="none" stroke="#FFD6F0" stroke-width="1.4"/>
  <path d="M89.11 63.27 A26 26 0 1 1 64 44 M62 32 L78 44 L62 56" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#00E1FF" stroke-width="17" stroke-opacity="0.85" filter="url(#bloom)"/>
  <path d="M89.11 63.27 A26 26 0 1 1 64 44 M62 32 L78 44 L62 56" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#22E8FF" stroke-width="12" filter="url(#soft)"/>
  <path d="M89.11 63.27 A26 26 0 1 1 64 44 M62 32 L78 44 L62 56" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#2FEAFF" stroke-width="10"/>
  <path d="M89.11 63.27 A26 26 0 1 1 64 44 M62 32 L78 44 L62 56" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#F2FFFF" stroke-width="4.2"/>
</svg>
