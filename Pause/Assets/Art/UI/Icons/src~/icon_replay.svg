<?xml version="1.0" encoding="UTF-8"?>
<!-- Pause HUD quick-action icon: Replay (restart run).
     Shared style with icon_home.svg: 128x128 viewBox, dark glass plate with a
     cyan (#87D9FF, HudStyler "Speed") rim, white 9-unit round-capped glyph with
     a soft cyan glow. Rasterize with ./render.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>
  <!-- plate -->
  <rect x="7" y="7" width="114" height="114" rx="28" fill="#0A1430" fill-opacity="0.62"/>
  <rect x="7" y="7" width="114" height="114" rx="28" fill="none" stroke="#87D9FF" stroke-width="4" stroke-opacity="0.9"/>
  <!-- glyph: 300 degree clockwise arc + arrowhead at the top pointing right -->
  <g id="glyph-glow" filter="url(#glow)" stroke="#87D9FF" fill="#87D9FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M89.11 63.27 A26 26 0 1 1 64 44" fill="none"/>
    <path d="M63 31 L79 44 L63 57 Z"/>
  </g>
  <g id="glyph" stroke="#F4F8FF" fill="#F4F8FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M89.11 63.27 A26 26 0 1 1 64 44" fill="none"/>
    <path d="M63 31 L79 44 L63 57 Z"/>
  </g>
</svg>
