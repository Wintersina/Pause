<?xml version="1.0" encoding="UTF-8"?>
<!-- Pause icon: Play (start a real run; the tutorial end card's PLAY). Only the glyph-only variant is rendered.
     Akira / 80s-anime style (docs/art-style.md): chamfered NIGHT plate, INK
     contour, one INDIGO sheen facet, RED keyline; BONE glyph with an INK
     outline and a hard RED cel shadow. Generated by build_icons.py;
     rasterise with ./render.sh (also with the glyph and shine flags). -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <polygon class="plate" points="30,8 98,8 120,30 120,98 98,120 30,120 8,98 8,30" fill="#0E1424"/>
  <polygon class="plate" points="32,14 96,14 114,32 114,96 96,114 32,114 14,96 14,32" fill="#1A1F45"/>
  <polygon class="plate" points="14,32 32,14 58,14 14,58" fill="#2A2E6B"/>
  <!--SHINE-->
  <polygon class="plate" points="32,14 96,14 114,32 114,96 96,114 32,114 14,96 14,32" fill="none" stroke="#D8232C" stroke-width="2" stroke-linejoin="miter" stroke-miterlimit="2.5"/>
  <polygon class="plate" points="30,8 98,8 120,30 120,98 98,120 30,120 8,98 8,30" fill="none" stroke="#140C14" stroke-width="5" stroke-linejoin="miter" stroke-miterlimit="2.5"/>
  <polygon points="51,37 101,69 51,101" fill="#D8232C" stroke="#D8232C" stroke-width="10" stroke-linejoin="miter" stroke-miterlimit="2.5"/>
  <polygon points="46,32 96,64 46,96" fill="#140C14" stroke="#140C14" stroke-width="10" stroke-linejoin="miter" stroke-miterlimit="2.5"/>
  <polygon points="46,32 96,64 46,96" fill="#F4EAD4" stroke="#F4EAD4" stroke-width="0" stroke-linejoin="miter" stroke-miterlimit="2.5"/>
</svg>
