  Colours are palette.env names, filled in by render.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <path d="M2 2 L46 2 L46 40 L40 46 L2 46 Z" fill="#FFFFFF" fill-opacity="0.14"/>
  <rect x="2" y="2" width="8" height="44" fill="#FFFFFF"/>
  <path d="M2 2 L46 2 L46 40 L40 46 L2 46 Z" fill="none" stroke="@INK@" stroke-width="3" stroke-linejoin="miter"/>
</svg>
