<?xml version="1.0" encoding="UTF-8"?>
<!--
  The tutorial robot, flat 80s-anime cel style: bold angular shapes, one
  shadow tone and one highlight tone, thick ink outlines and panel lines,
  small red indicator lights. The face screen is left empty: eyes and mouth
  are frame-by-frame sprites (tut_eye_*, tut_mouth_*) that RobotSpeaker.cs
  swaps on top, at the coordinates below (y measured down from the top).
  Units are UI canvas units; rasterize at 2x (256x256 px, sprite ppu 200).
  Colours are palette.env names, filled in by render.sh.
  Eyes centred at (47, 57) and (81, 57). Mouth centred at (64, 79).
  Antenna lamp at (77, 9). Jet attaches at (64, 108).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <clipPath id="head">
      <path d="M24 32 L44 20 L84 20 L104 32 L112 72 L98 106 L30 106 L16 72 Z"/>
    </clipPath>
  </defs>
  <!-- antenna: an angular blade with a lamp socket -->
  <path d="M70 26 L74 6 L80 6 L80 26 Z" fill="@STEEL@" stroke="@INK@" stroke-width="3.5" stroke-linejoin="miter"/>
  <path d="M77 8 L80 6 L80 26 L77 26 Z" fill="@STEEL_SHADE@"/>
  <!-- ear blocks with red indicator lights -->
  <path d="M6 50 L20 46 L22 92 L8 86 Z" fill="@STEEL_SHADE@" stroke="@INK@" stroke-width="4" stroke-linejoin="miter"/>
  <path d="M122 50 L108 46 L106 92 L120 86 Z" fill="@STEEL_SHADE@" stroke="@INK@" stroke-width="4" stroke-linejoin="miter"/>
  <rect x="10" y="58" width="6" height="6" fill="@RED@" stroke="@INK@" stroke-width="1.5"/>
  <rect x="112" y="58" width="6" height="6" fill="@RED@" stroke="@INK@" stroke-width="1.5"/>
  <path d="M11 72 L18 72 M11 77 L18 77" stroke="@INK@" stroke-width="2"/>
  <path d="M110 72 L117 72 M110 77 L117 77" stroke="@INK@" stroke-width="2"/>
  <!-- head: flat body tone, one hard shadow, one hard highlight -->
  <path d="M24 32 L44 20 L84 20 L104 32 L112 72 L98 106 L30 106 L16 72 Z" fill="@STEEL@"/>
  <g clip-path="url(#head)">
    <path d="M92 16 L120 16 L120 112 L60 112 L60 96 L100 96 L104 60 Z" fill="@STEEL_SHADE@"/>
    <path d="M10 16 L60 16 L56 24 L30 34 L20 64 L10 64 Z" fill="@STEEL_LIGHT@"/>
  </g>
  <path d="M24 32 L44 20 L84 20 L104 32 L112 72 L98 106 L30 106 L16 72 Z" fill="none" stroke="@INK@" stroke-width="4.5" stroke-linejoin="miter"/>
  <!-- panel lines and the forehead light -->
  <path d="M40 29 L88 29" stroke="@INK@" stroke-width="2.5"/>
  <path d="M30 100 L44 96 L84 96 L98 100" fill="none" stroke="@INK@" stroke-width="2.5" stroke-linejoin="miter"/>
  <path d="M52 101 L52 106 M60 101 L60 106 M68 101 L68 106 M76 101 L76 106" stroke="@INK@" stroke-width="2"/>
  <rect x="91" y="24" width="5" height="5" fill="@RED@" stroke="@INK@" stroke-width="1.5"/>
  <!-- face screen: flat night fill, ink rim, a single hard glare stripe -->
  <path d="M30 40 L98 40 L102 64 L92 90 L36 90 L26 64 Z" fill="@NIGHT@" stroke="@INK@" stroke-width="4" stroke-linejoin="miter"/>
  <path d="M84 44 L94 44 L72 86 L62 86 Z" fill="@INDIGO@"/>
  <!-- angular brow plate over the screen: gives the face its attitude -->
  <path d="M28 40 L58 40 L54 46 L30 46 Z" fill="@STEEL_SHADE@" stroke="@INK@" stroke-width="2.5" stroke-linejoin="miter"/>
  <path d="M100 40 L70 40 L74 46 L98 46 Z" fill="@STEEL_SHADE@" stroke="@INK@" stroke-width="2.5" stroke-linejoin="miter"/>
</svg>
