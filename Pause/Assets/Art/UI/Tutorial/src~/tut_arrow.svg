<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hint arrow: a double chevron pointing UP (rotated at runtime toward its
  target), white template tinted gold, with a soft bloom.
  Units are UI canvas units; rasterize at 2x (96x96 px, sprite ppu 200).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="7" stroke-opacity="0.6" filter="url(#glow)">
      <path d="M12 24 L24 12 L36 24"/>
      <path d="M12 36 L24 24 L36 36"/>
    </g>
    <path d="M12 24 L24 12 L36 24" stroke-width="5"/>
    <path d="M12 36 L24 24 L36 36" stroke-width="5" stroke-opacity="0.55"/>
  </g>
</svg>
