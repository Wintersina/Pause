<?xml version="1.0" encoding="UTF-8"?>
<!--
  Robot eye - white template with its own bloom, tinted cyan at runtime and
  squashed vertically to blink. Core capsule 8x12u centred in a 20x24u canvas.
  Rasterize at 2x (40x48 px, sprite ppu 200).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="20" height="24" viewBox="0 0 20 24">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="8" height="12" rx="4" fill="#ffffff" fill-opacity="0.8" filter="url(#glow)"/>
  <rect x="6" y="6" width="8" height="12" rx="4" fill="#ffffff"/>
</svg>
