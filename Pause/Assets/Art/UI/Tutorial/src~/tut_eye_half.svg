<?xml version="1.0" encoding="UTF-8"?>
<!--
  Robot eye, frame "half" of the frame-by-frame blink (open, half, shut) plus
  "happy" for exclamations. Drawn as the LEFT eye; the right eye is the same
  sprite mirrored. Flat teal light with an ink outline and one paper glint.
  26x20 units, rasterize at 2x (52x40 px, sprite ppu 200).
  Colours are palette.env names, filled in by render.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="26" height="20" viewBox="0 0 26 20">
  <path d="M2 9 L24 12 L24 17 L2 17 Z" fill="@TEAL@" stroke="@INK@" stroke-width="2.5" stroke-linejoin="miter"/>
</svg>
