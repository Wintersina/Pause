<?xml version="1.0" encoding="UTF-8"?>
<!--
  Thin neon ring with a soft bloom - white template, tinted at runtime.
  Radiates out of the robot on stressed syllables and pulses under the
  "touch here" hint. Units are UI canvas units; rasterize at 2x (256x256 px,
  sprite ppu 200).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.7" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#ffffff" stroke-width="2.5"/>
</svg>
