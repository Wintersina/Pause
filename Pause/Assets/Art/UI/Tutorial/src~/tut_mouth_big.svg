<?xml version="1.0" encoding="UTF-8"?>
<!--
  Robot mouth on the face screen, frame "big (stressed beats, exclamations)". RobotSpeaker.cs picks the
  frame per syllable from its vowel (rest between words, big on stressed
  beats) and holds each for whole animation steps, cartoon style.
  Flat teal light with an ink outline, one dark shade inside the opening.
  36x20 units, rasterize at 2x (72x40 px, sprite ppu 200).
  Colours are palette.env names, filled in by render.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="20" viewBox="0 0 36 20">
  <path d="M3 2 L33 2 L27 18 L9 18 Z" fill="@TEAL@" stroke="@INK@" stroke-width="2.5" stroke-linejoin="miter"/>
  <path d="M8 6 L28 6 L24 15 L12 15 Z" fill="@TEAL_SHADE@"/>
  <path d="M12 6 L24 6 L23 8 L13 8 Z" fill="@PAPER@"/>
</svg>
