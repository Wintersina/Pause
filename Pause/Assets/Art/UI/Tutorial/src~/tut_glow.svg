<?xml version="1.0" encoding="UTF-8"?>
<!--
  Soft round light - white template, tinted at runtime. The antenna bulb,
  the hover jet under the robot and the touch-hint dot.
  Units are UI canvas units; rasterize at 2x (128x128 px, sprite ppu 200).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="g" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#g)"/>
</svg>
