<?xml version="1.0" encoding="UTF-8"?>
<!--
  Speech bubble tail, pointing left at the robot. Placed so x=21 sits on the
  bubble body's left edge: the flat fill (same #0a132f as tut_bubble.svg)
  runs 5u past that line to cover the body's neon edge, and only the two
  outer sides carry the cyan stroke, so the two read as one shape.
  Units are UI canvas units; rasterize at 2x (52x40 px, sprite ppu 200).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="26" height="20" viewBox="0 0 26 20">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <path d="M21 3 L3 10 L21 17" fill="none" stroke="#3fd8ff" stroke-width="3"
        stroke-opacity="0.45" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M21 3 L3 10 L21 17 L26 17 L26 3 Z" fill="#0a132f" fill-opacity="0.95"/>
  <path d="M21 3.2 L3.4 10 L21 16.8" fill="none" stroke="#52e6ff" stroke-width="2"
        stroke-opacity="0.95" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
