<?xml version="1.0" encoding="UTF-8"?>
<!--
  Speech bubble tail, pointing left at the robot. x=21 sits on the bubble
  body's left edge: the flat fill runs 5u past it to cover the body's ink
  outline, so the two read as one panel. Hard ink shadow like the body.
  26x20 units, rasterize at 2x (52x40 px).
  Colours are palette.env names, filled in by render.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="26" height="20" viewBox="0 0 26 20">
  <path d="M23 7 L5 13 L23 19 Z" fill="@INK@"/>
  <path d="M21 3 L2 11 L21 15 L26 15 L26 3 Z" fill="@INDIGO@"/>
  <path d="M21 3 L2 11 L21 15" fill="none" stroke="@INK@" stroke-width="3" stroke-linejoin="miter"/>
</svg>
