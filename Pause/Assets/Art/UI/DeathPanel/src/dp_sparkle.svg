<?xml version="1.0" encoding="UTF-8"?>
<!--
  Four-point star sparkle with a soft halo - white template, tinted gold at
  runtime. Used for the header ornaments and the star-dust sparkle burst.
  Units are UI canvas units; rasterize at 2x (128x128 px, sprite ppu 200).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#halo)"/>
  <path d="M32 4 C34 24 40 30 60 32 C40 34 34 40 32 60 C30 40 24 34 4 32 C24 30 30 24 32 4 Z"
        fill="#ffffff"/>
</svg>
