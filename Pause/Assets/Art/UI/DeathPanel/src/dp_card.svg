<?xml version="1.0" encoding="UTF-8"?>
<!--
  Stat card - white template, tinted per row (cyan / coral / gold) by Image.color.
  Units are UI canvas units; rasterize at 2x (192x192 px, sprite ppu 200).
  Corner radius 14. Left accent bar sits inside the 26u left border.
  9-slice border: left 26u, right/top/bottom 18u.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="94" height="94" rx="14" fill="url(#wash)"/>
  <rect x="1.75" y="1.75" width="92.5" height="92.5" rx="13.25" fill="none"
        stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="10" y="16" width="5" height="64" rx="2.5" fill="#ffffff"/>
</svg>
