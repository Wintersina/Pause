<?xml version="1.0" encoding="UTF-8"?>
<!--
  Stat card: flat CARD fill, chamfered top-right and bottom-left corners,
  INK contour. Drawn in its final colours (Image.color white); the row's
  accent is the separate dp_bar sprite.
  Units are UI canvas units; rasterize at 2x (192x192 px, sprite ppu 200).
  Chamfer 14. 9-slice border: left 26u, right/top/bottom 18u.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <polygon points="2,2 80,2 94,16 94,94 16,94 2,80" fill="#151B30"/>
  <polygon points="2,2 80,2 94,16 94,94 16,94 2,80" fill="none" stroke="#140C14" stroke-width="3.5" stroke-linejoin="miter"/>
</svg>
