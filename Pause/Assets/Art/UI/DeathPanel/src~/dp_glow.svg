<?xml version="1.0" encoding="UTF-8"?>
<!--
  Rim flash - a hard-edged chamfered ring (no blur: the art guide keeps glow
  for lights only), white template tinted at runtime. Flashed behind the
  buttons (idle beat, press) and around the best-speed card (new-best pulse).
  Units are UI canvas units; rasterize at 2x (224x224 px, sprite ppu 200).
  The ring sits in the 20u margin outside a 72u core; 9-slice border 48u.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112">
  <polygon points="30,8 104,8 104,82 82,104 8,104 8,30" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="miter"/>
  <polygon points="33,16 96,16 96,79 79,96 16,96 16,33" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="miter" stroke-opacity="0.6"/>
</svg>
