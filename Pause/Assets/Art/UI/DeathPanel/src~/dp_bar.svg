-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="72" viewBox="0 0 16 72">
  <polygon points="6,2 14,2 10,70 2,70" fill="#FFFFFF"/>
  <polygon points="6,2 14,2 10,70 2,70" fill="none" stroke="#140C14" stroke-width="2" stroke-linejoin="miter"/>
</svg>
