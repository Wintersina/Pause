<?xml version="1.0" encoding="UTF-8"?>
<!--
  Action button: chamfered plate, INK contour and a hard cel offset slab.
  A template tinted per action (cyan replay / red menu) by Image.color: the
  offset slab is white, so it takes the accent; the body is a dark grey, so
  the tint darkens it into a near-night accent plate; the ink stays ink.
  Units are UI canvas units; rasterize at 2x (192x160 px, sprite ppu 200).
  Chamfer 14. 9-slice border 24u on all sides.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="80" viewBox="0 0 96 80">
  <polygon points="21,7 95,7 95,65 81,79 7,79 7,21" fill="#FFFFFF"/>
  <polygon points="16,2 89,2 89,59 75,73 2,73 2,16" fill="#2C3346"/>
  <polygon points="16,2 89,2 89,59 75,73 2,73 2,16" fill="none" stroke="#140C14" stroke-width="3.5" stroke-linejoin="miter"/>
</svg>
