<?xml version="1.0" encoding="UTF-8"?>
<!--
  Four-point star: hard straight-edged rays, an INK contour and a cel facet
  split (the lower-right quarter one shade down). White template, tinted
  gold at runtime. Header ornaments and the star-dust burst. No halo.
  Units are UI canvas units; rasterize at 2x (128x128 px, sprite ppu 200).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <polygon points="32,5 38,26 59,32 38,38 32,59 26,38 5,32 26,26" fill="#FFFFFF"/>
  <polygon points="59,32 38,38 32,59 32,32" fill="#BFBFBF"/>
  <polygon points="32,5 38,26 59,32 38,38 32,59 26,38 5,32 26,26" fill="none" stroke="#140C14" stroke-width="3" stroke-linejoin="miter"/>
</svg>
