<!--
  Header divider: a hard RED rule under a BONE rule (the title-card stripe)
  on an INK bed, broken at the centre by an inked AMBER diamond. Flat
  colours, drawn final. Not sliced; drawn with preserveAspect.
  Units are UI canvas units; rasterize at 2x (880x32 px, sprite ppu 200).
-->
