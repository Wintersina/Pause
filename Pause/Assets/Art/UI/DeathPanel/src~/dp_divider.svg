  <polygon points="6,5 204,5 202,11 4,11" fill="#140C14"/>
  <polygon points="236,5 434,5 432,11 234,11" fill="#140C14"/>
  <rect x="6" y="6" width="196" height="2" fill="#F4EAD4"/>
  <rect x="5" y="8" width="196" height="2" fill="#D8232C"/>
  <rect x="236" y="6" width="196" height="2" fill="#F4EAD4"/>
  <rect x="235" y="8" width="196" height="2" fill="#D8232C"/>
  <polygon points="220,1 227,8 220,15 213,8" fill="#FFB43C" stroke="#140C14" stroke-width="2" stroke-linejoin="miter"/>
</svg>
