<?xml version="1.0" encoding="UTF-8"?>
<!--
  Header divider: a cyan rule that fades out at both ends, a gold diamond at
  the centre and a pair of cyan beads. Not sliced; drawn with preserveAspect.
  Units are UI canvas units; rasterize at 2x (880x32 px, sprite ppu 200).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="16" viewBox="0 0 440 16">
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52e6ff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#52e6ff" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#52e6ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#52e6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect x="0" y="7" width="198" height="2" rx="1" fill="url(#rule)"/>
  <rect x="242" y="7" width="198" height="2" rx="1" fill="url(#rule)"/>
  <circle cx="204" cy="8" r="2" fill="#52e6ff"/>
  <circle cx="236" cy="8" r="2" fill="#52e6ff"/>
  <path d="M220 1 L227 8 L220 15 L213 8 Z" fill="#ffc542" filter="url(#soft)" opacity="0.7"/>
  <path d="M220 2.5 L225.5 8 L220 13.5 L214.5 8 Z" fill="#ffd36b"/>
</svg>
