<?xml version="1.0" encoding="UTF-8"?>
<!--
  Flight Complete panel frame - 9-slice source. Akira / 80s-anime style
  (docs/art-style.md): flat NIGHT_1 body, chamfered corners, a thick INK
  contour, an INDIGO_1 inner keyline, one INDIGO_0 sheen facet and a hard
  INK cel drop shadow in the margin. No gradients, no bloom.
  Units are UI canvas units; rasterize at 2x (320x320 px, sprite ppu 200).
  Layout: 20u margin on every side, frame rect 20..140, chamfer 26.
  9-slice border = 64u (128 px) on all four sides, so the chamfers never stretch.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <polygon points="54,28 154,28 154,128 128,154 28,154 28,54" fill="#140C14" fill-opacity="0.85"/>
  <polygon points="46,20 140,20 140,114 114,140 20,140 20,46" fill="#0E1424" fill-opacity="0.97"/>
  <polygon points="22,46 46,22 76,22 22,76" fill="#1A1F45"/>
  <polygon points="48.5,26 134,26 134,111.5 111.5,134 26,134 26,48.5" fill="none" stroke="#2A2E6B" stroke-width="1.5" stroke-linejoin="miter"/>
  <polygon points="46,20 140,20 140,114 114,140 20,140 20,46" fill="none" stroke="#140C14" stroke-width="5" stroke-linejoin="miter"/>
</svg>
