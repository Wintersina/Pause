  <path d="M25.2 7 H50.8 L69 25.2 V50.8 L50.8 69 H25.2 L7 50.8 V25.2 Z" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-dasharray="9 4.2" stroke-linejoin="miter"/>
