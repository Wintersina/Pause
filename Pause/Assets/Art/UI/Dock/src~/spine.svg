  <rect x="1" y="0" width="10" height="40" fill="#2C2D40"/>
  <rect x="1" y="0" width="2" height="40" fill="#5A5C78"/>
  <rect x="9" y="0" width="2" height="40" fill="#1A1A28"/>
  <rect x="5" y="0" width="2" height="40" fill="#0F5E6A"/>
  <rect x="3" y="18" width="6" height="4" fill="#140C14"/>
  <rect x="4" y="19" width="4" height="2" fill="#1FB5B9"/>
</svg>
