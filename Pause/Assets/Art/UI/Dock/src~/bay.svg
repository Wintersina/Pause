<?xml version="1.0" encoding="UTF-8"?>
<!-- One parking berth, seen from above. 100 units = 1 world unit.
     The ship parks nose-up over the landing ring; the hazard-striped mouth at
     the top is the way out. The recessed slot along the back wall carries the
     ship's name plate (drawn by the game, not baked in).
     Akira restyle (docs/art-style.md): flat fills only (no gradients), GUN
     metal rails with one GUN_HI kick, INDIGO deck with panel lines, AMBER/INK
     hazard stripes, TEAL deck brackets, INK contours. -->
<svg xmlns="http://www.w3.org/2000/svg" width="162" height="136" viewBox="0 0 162 136">
  <defs>
    <pattern id="haz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="3.5" height="7" fill="#FFB43C"/>
      <rect x="3.5" width="3.5" height="7" fill="#140C14"/>
    </pattern>
  </defs>

  <!-- floor slab -->
  <path d="M9 2 H153 L160 9 V127 L153 134 H9 L2 127 V9 Z" fill="#0E1424"/>

  <!-- landing deck: flat INDIGO_0, one hard shadow band on the lower right -->
  <rect x="22" y="12" width="118" height="102" fill="#1A1F45"/>
  <path d="M140 12 V114 H22 V106 H132 V12 Z" fill="#0E1424"/>
  <g stroke="#2A2E6B" stroke-width="0.8">
    <line x1="22" y1="36" x2="140" y2="36"/>
    <line x1="22" y1="86" x2="140" y2="86"/>
    <line x1="52" y1="12" x2="52" y2="36"/>
    <line x1="110" y1="12" x2="110" y2="36"/>
    <line x1="52" y1="86" x2="52" y2="114"/>
    <line x1="110" y1="86" x2="110" y2="114"/>
  </g>

  <!-- painted landing marks: an octagon pad, not a circle -->
  <path d="M68.2 27 H93.8 L112 45.2 V70.8 L93.8 89 H68.2 L50 70.8 V45.2 Z" fill="none" stroke="#2A2E6B" stroke-width="1.6"/>
  <rect x="78.5" y="55.5" width="5" height="5" fill="#2A2E6B"/>
  <g stroke="#0F5E6A" stroke-width="1.8" stroke-linecap="butt">
    <line x1="81" y1="21" x2="81" y2="27"/>
    <line x1="81" y1="89" x2="81" y2="95"/>
    <line x1="44" y1="58" x2="50" y2="58"/>
    <line x1="112" y1="58" x2="118" y2="58"/>
  </g>

  <!-- deck corner brackets -->
  <g fill="none" stroke="#1FB5B9" stroke-width="1.6" stroke-linejoin="miter">
    <path d="M26 24 V16 H34"/>
    <path d="M26 102 V110 H34"/>
    <path d="M136 102 V110 H128"/>
  </g>

  <!-- side rails (cradle walls): flat GUN with a GUN_HI kick on the lit edge -->
  <path d="M4 10 L10 4 H22 V114 H4 Z" fill="#2C2D40"/>
  <path d="M158 10 L152 4 H140 V114 H158 Z" fill="#1A1A28"/>
  <line x1="5.2" y1="10.4" x2="5.2" y2="114" stroke="#5A5C78" stroke-width="1"/>
  <line x1="141.2" y1="4" x2="141.2" y2="114" stroke="#5A5C78" stroke-width="1"/>
  <line x1="21.6" y1="4" x2="21.6" y2="114" stroke="#140C14" stroke-width="1.2"/>
  <line x1="140.4" y1="4" x2="140.4" y2="114" stroke="#140C14" stroke-width="1.2"/>
  <g fill="#5A5C78">
    <rect x="9" y="24" width="5" height="3"/>
    <rect x="9" y="38" width="5" height="3"/>
    <rect x="9" y="78" width="5" height="3"/>
    <rect x="9" y="92" width="5" height="3"/>
    <rect x="148" y="24" width="5" height="3"/>
    <rect x="148" y="38" width="5" height="3"/>
    <rect x="148" y="78" width="5" height="3"/>
    <rect x="148" y="92" width="5" height="3"/>
  </g>
  <!-- clamp slots -->
  <rect x="15" y="50" width="7" height="16" fill="#070A16"/>
  <rect x="140" y="50" width="7" height="16" fill="#070A16"/>

  <!-- lamp housings (lights are separate sprites on top), chamfered -->
  <g fill="#070A16" stroke="#140C14" stroke-width="1">
    <path d="M10 8 H14 L16 10 V14 L14 16 H10 L8 14 V10 Z"/>
    <path d="M148 8 H152 L154 10 V14 L152 16 H148 L146 14 V10 Z"/>
    <path d="M10 100 H14 L16 102 V106 L14 108 H10 L8 106 V102 Z"/>
    <path d="M148 100 H152 L154 102 V106 L152 108 H148 L146 106 V102 Z"/>
  </g>

  <!-- hazard-striped mouth -->
  <rect x="22" y="4" width="118" height="6" fill="url(#haz)"/>
  <line x1="22" y1="10.5" x2="140" y2="10.5" stroke="#140C14" stroke-width="1.2"/>

  <!-- back wall with name plate recess; a RED kick along its top edge -->
  <path d="M4 114 H158 V127 L152 133 H10 L4 127 Z" fill="#1A1A28"/>
  <line x1="4" y1="114.8" x2="158" y2="114.8" stroke="#D8232C" stroke-width="1.4"/>
  <path d="M26 117 H136 L139 120 V127 L136 130 H26 L23 127 V120 Z" fill="#070A16" stroke="#140C14" stroke-width="1"/>

  <!-- ink contour over everything -->
  <path d="M9 2 H153 L160 9 V127 L153 134 H9 L2 127 V9 Z" fill="none" stroke="#140C14" stroke-width="2.2" stroke-linejoin="miter"/>
</svg>
