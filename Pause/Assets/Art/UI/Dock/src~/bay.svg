<?xml version="1.0" encoding="UTF-8"?>
<!-- One parking berth, seen from above. 100 units = 1 world unit.
     The ship parks nose-up over the landing ring; the hazard-striped mouth at
     the top is the way out. The recessed slot along the back wall carries the
     ship's name plate (drawn by the game, not baked in). -->
<svg xmlns="http://www.w3.org/2000/svg" width="162" height="136" viewBox="0 0 162 136">
  <defs>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1B33"/>
      <stop offset="1" stop-color="#08111F"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141F33"/>
      <stop offset="0.7" stop-color="#1A2C47"/>
      <stop offset="1" stop-color="#223A5C"/>
    </linearGradient>
    <linearGradient id="railR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#141F33"/>
      <stop offset="0.7" stop-color="#1A2C47"/>
      <stop offset="1" stop-color="#223A5C"/>
    </linearGradient>
    <pattern id="haz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="3.5" height="7" fill="#FFC943"/>
      <rect x="3.5" width="3.5" height="7" fill="#15171F"/>
    </pattern>
  </defs>

  <!-- floor slab -->
  <path d="M9 2 H153 L160 9 V127 L153 134 H9 L2 127 V9 Z" fill="#081120" stroke="#1B3557" stroke-width="1.2"/>

  <!-- landing deck -->
  <rect x="22" y="12" width="118" height="102" fill="url(#deck)"/>
  <g stroke="#13284A" stroke-width="0.8">
    <line x1="22" y1="36" x2="140" y2="36"/>
    <line x1="22" y1="86" x2="140" y2="86"/>
    <line x1="52" y1="12" x2="52" y2="36"/>
    <line x1="110" y1="12" x2="110" y2="36"/>
    <line x1="52" y1="86" x2="52" y2="114"/>
    <line x1="110" y1="86" x2="110" y2="114"/>
  </g>

  <!-- painted landing marks -->
  <circle cx="81" cy="58" r="31" fill="none" stroke="#1A3A62" stroke-width="1.4"/>
  <circle cx="81" cy="58" r="3" fill="#1A3A62"/>
  <g stroke="#2A5A8C" stroke-width="1.6" stroke-linecap="square">
    <line x1="81" y1="22" x2="81" y2="27"/>
    <line x1="81" y1="89" x2="81" y2="94"/>
    <line x1="45" y1="58" x2="50" y2="58"/>
    <line x1="112" y1="58" x2="117" y2="58"/>
  </g>

  <!-- deck corner brackets -->
  <g fill="none" stroke="#2EE6FF" stroke-opacity="0.45" stroke-width="1.4">
    <path d="M26 24 V16 H34"/>
    <path d="M26 102 V110 H34"/>
    <path d="M136 102 V110 H128"/>
  </g>

  <!-- side rails (cradle walls) -->
  <path d="M4 10 L10 4 H22 V114 H4 Z" fill="url(#rail)"/>
  <path d="M158 10 L152 4 H140 V114 H158 Z" fill="url(#railR)"/>
  <line x1="21.4" y1="4" x2="21.4" y2="114" stroke="#335883" stroke-width="1"/>
  <line x1="140.6" y1="4" x2="140.6" y2="114" stroke="#335883" stroke-width="1"/>
  <g fill="#2E4B73">
    <rect x="9" y="24" width="5" height="3"/>
    <rect x="9" y="38" width="5" height="3"/>
    <rect x="9" y="78" width="5" height="3"/>
    <rect x="9" y="92" width="5" height="3"/>
    <rect x="148" y="24" width="5" height="3"/>
    <rect x="148" y="38" width="5" height="3"/>
    <rect x="148" y="78" width="5" height="3"/>
    <rect x="148" y="92" width="5" height="3"/>
  </g>
  <!-- clamp slots -->
  <rect x="15" y="50" width="7" height="16" fill="#060C18"/>
  <rect x="140" y="50" width="7" height="16" fill="#060C18"/>

  <!-- lamp housings (lights are separate sprites on top) -->
  <g fill="#060C18" stroke="#223A5C" stroke-width="0.8">
    <rect x="8" y="8" width="8" height="8" rx="1.5"/>
    <rect x="146" y="8" width="8" height="8" rx="1.5"/>
    <rect x="8" y="100" width="8" height="8" rx="1.5"/>
    <rect x="146" y="100" width="8" height="8" rx="1.5"/>
  </g>

  <!-- hazard-striped mouth -->
  <rect x="22" y="4" width="118" height="6" fill="url(#haz)" opacity="0.8"/>
  <line x1="22" y1="10.5" x2="140" y2="10.5" stroke="#05090F" stroke-width="1"/>

  <!-- back wall with name plate recess -->
  <path d="M4 114 H158 V127 L152 133 H10 L4 127 Z" fill="#14233B"/>
  <line x1="4" y1="114.5" x2="158" y2="114.5" stroke="#2E5583" stroke-width="1"/>
  <path d="M26 117 H136 L139 120 V127 L136 130 H26 L23 127 V120 Z" fill="#071022" stroke="#1F416B" stroke-width="0.8"/>
</svg>
