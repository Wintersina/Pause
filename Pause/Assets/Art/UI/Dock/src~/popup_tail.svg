<?xml version="1.0" encoding="UTF-8"?>
<!-- Pointer under the popup, aimed at the ship. Its flat top overlaps the
     panel's bottom edge so the outline reads as one shape. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="10" viewBox="0 0 16 10">
  <path d="M0 0 H16 L8 9 Z" fill="#081428"/>
  <path d="M0.6 1.2 L8 9 L15.4 1.2" fill="none" stroke="#2EE6FF" stroke-width="1.5" stroke-linejoin="miter"/>
</svg>
