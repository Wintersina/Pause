<?xml version="1.0" encoding="UTF-8"?>
<!-- Horizontal gantry truss between berth rows. Tiles seamlessly every 40
     units along x. -->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="12" viewBox="0 0 40 12">
  <g stroke="#1C3152" stroke-width="1.6" stroke-linecap="butt">
    <line x1="0" y1="3" x2="20" y2="9"/>
    <line x1="20" y1="9" x2="40" y2="3"/>
    <line x1="20" y1="3" x2="20" y2="9"/>
  </g>
  <rect x="0" y="1" width="40" height="2.4" fill="#22385A"/>
  <rect x="0" y="8.6" width="40" height="2.4" fill="#1B2D4A"/>
  <line x1="0" y1="1.4" x2="40" y2="1.4" stroke="#3B6290" stroke-width="0.8"/>
  <rect x="0" y="1" width="1.4" height="10" fill="#2A4468"/>
</svg>
