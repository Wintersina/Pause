<?xml version="1.0" encoding="UTF-8"?>
<!-- Soft drop shadow under a hull; it slides away as the ship gains height. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="s" cx="32" cy="32" r="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#s)"/>
</svg>
